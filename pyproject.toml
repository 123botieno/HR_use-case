[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "ethiopia-jobmatch"
version = "0.1.0"
description = "HR shortlisting fairness teaching case"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "pandas==3.0.6", "scikit-learn==1.9.1", "fairlearn==0.15.0"]

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
test = ["pytest>=8,<9"]

[project.scripts]
jobmatch = "jobmatch.cli:main"

[tool.setuptools.packages.find]
include = ["jobmatch*", "common*", "0*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

